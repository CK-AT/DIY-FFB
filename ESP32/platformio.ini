; ---------------------------------------------------------------------------
; LEGACY fallback: arduino-esp32 2.0.17 with Serial on UART0 -> CH343, i.e. the
; configuration shipped up to 0.2.34. Kept so a hardware problem with native USB
; can be bisected against a known-good build; delete once the CDC path has flown.
; Note: switching between this and a6-ffb-v10-ck-at re-downloads the whole
; framework package, since both platforms share unversioned package dirs.
; ---------------------------------------------------------------------------
[env:a6-ffb-v10-ck-at-core2]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.f_cpu = 240000000L
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-Werror=return-type
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DARDUINO_USB_DFU_ON_BOOT=0
	-DPCB_VERSION=13
	-DUSB_VID=0x303b
	-DUSB_PID=0x8211
	'-DUSB_PRODUCT="DiyFfbPedal"'
	'-DUSB_MANUFACTURER="OpenSource"'
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
lib_deps = 
	${common.lib_deps_external}
	Joystick_ESP32S3=https://github.com/tcfshcrw/Joystick_ESP32S3/archive/260e8063f0341c0de4f62332750b4b408c1ba846.zip
	regenbogencode/ESPNowW@^1.0.2
	miq19/eModbus@^1.7.2
	makuna/NeoPixelBus @ 2.8.4
	https://github.com/handmade0octopus/ESP32-TWAI-CAN.git#398d0af15cafc6664da10274f0afc73e75c480d0
	https://github.com/SimonCahill/isotp-c.git#v1.5.0
	bblanchon/ArduinoJson@^7.4.2

; ---------------------------------------------------------------------------
; arduino-esp32 3.3.12 (IDF 5.5.5) via the pioarduino platform fork, with the
; USB stack doing HID and CDC natively -- no CH343 in the data path. The chip
; stays fitted, so UART0 is still there to read a panic from.
;
; arduino-esp32#10307 (composite CDC+HID stall, the reason db835660 moved
; Serial to the CH343 UART in the first place) was fixed and closed
; 2026-05-24, confirmed on core 3.3.8. Official PlatformIO does not track
; core 3.x, hence the pioarduino platform zip. Requires PlatformIO Core
; >= 6.2.0.
; ---------------------------------------------------------------------------
[env:a6-ffb-v10-ck-at]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
platform_packages =
board = esp32-s3-devkitc-1
; Project-local variant so USB_VID/USB_PID below actually take effect. The
; stock esp32s3 variant defines them unguarded, which overrides the -D flags;
; ours only adds #ifndef around those two lines. Resolved against $PROJECT_DIR
; and added to the core lib's include path, so USB.cpp sees it.
board_build.variants_dir = variants
board_build.variant = a6_ffb_v10
; FastAccelStepper is unused here (nothing in src/ or include/ references it;
; the stepper we actually use is our own FastNonAccelStepper). On IDF 5 its
; FastAccelStepper_idf5_esp32_pcnt.cpp links the NEW pcnt driver, while
; FastNonAccelStepper.cpp uses the legacy driver/pcnt.h. IDF's legacy driver
; has a startup constructor that abort()s when both are linked -- so merely
; linking the unused library bootlooped the board before app_main:
;   "pcnt(legacy): CONFLICT! driver_ng is not allowed to be used with the
;    legacy driver" -> abort() in do_global_ctors.
; Ignored rather than removed from [common] so the legacy -core2 env, which
; builds against IDF 5.1 and is known good, is left exactly as it was.
lib_ignore = FastAccelStepper
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.f_cpu = 240000000L
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-Werror=return-type
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=0
	; MUST stay 0. With CDC on boot the core calls USB.begin() from app_main
	; before setup(), and ESPUSB's VID/PID/productName setters are no-ops once
	; started -- CommManager::setup_joystick()'s per-device identity (gateway
	; 0x8210+N / axis 0x8220+N, "DIY-FFB-Gateway-N") would silently do nothing
	; and every board would enumerate as gateway 1 / "DiyFfbPedal". Main.cpp
	; owns the CDC instance instead and USB.begin() runs once the ID is known.
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DPROTOCOL_OVER_USB_CDC=1
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DARDUINO_USB_DFU_ON_BOOT=0
	-DPCB_VERSION=13
	-DUSB_VID=0x303b
	-DUSB_PID=0x8211
	'-DUSB_PRODUCT="DiyFfbPedal"'
	'-DUSB_MANUFACTURER="OpenSource"'
	; Core 3.x: the bundled USB library gained USBHost*/USBMSCFS, which include
	; FS.h. Joystick_ESP32S3 includes USBHID.h, so the LDF compiles all of USB
	; even though we use no USB host. Neither declaring FS in lib_deps nor
	; lib_ldf_mode=deep+ propagates FS's include dir into USB's own compilation,
	; so point at it directly. Nothing references USBHostMSC, so its objects are
	; never pulled from the archive and no FS symbols are needed at link time.
	-I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
lib_deps =
	${common.lib_deps_external}
	Joystick_ESP32S3=https://github.com/tcfshcrw/Joystick_ESP32S3/archive/260e8063f0341c0de4f62332750b4b408c1ba846.zip
	; ESPNowW dropped: it does not build on IDF 5.x (esp_base_mac_addr_set moved
	; to esp_mac.h, which ESPNowW_32.cpp does not include) and it is dead weight
	; here anyway -- PCB 13 leaves ESPNow_S3 commented out and nothing includes
	; ESPNowW.h. Re-add a patched fork if a board revision ever needs ESP-NOW.
	miq19/eModbus@^1.7.2
	; NeoPixelBus dropped: it calls gpio_hal_iomux_func_sel, removed in IDF 5.5,
	; and upstream master still does -- no compatible release exists. Main.cpp
	; now drives the single status pixel with the core's built-in neopixelWrite.
	https://github.com/handmade0octopus/ESP32-TWAI-CAN.git#398d0af15cafc6664da10274f0afc73e75c480d0
	https://github.com/SimonCahill/isotp-c.git#v1.5.0
	bblanchon/ArduinoJson@^7.4.2
	FS
