; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = a6-ffb-v10-ck-at

[env]
framework = arduino
; Pinned explicitly: the pioarduino platform used by a6-ffb-v10-ck-at also
; calls itself "espressif32", so installing it overwrites platforms/espressif32
; and an unpinned "platform = espressif32" silently resolves to it -- which
; then fails looking for pioarduino-build.py in the 2.0.17 framework. The two
; can only coexist in one core dir if the official one is version-pinned.
; This line therefore serves the legacy envs below; the main env overrides it.
platform = espressif32@6.9.0
platform_packages = 
	platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.17
	platformio/framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-libs.git#idf-release/v5.1
monitor_speed = 115200
custom_nanopb_protos =
	+<../proto/diy_ffb_protocol.proto>
custom_nanopb_options =
    --error-on-unmatched
	-s packed_enum:true
extra_scripts = pre:scripts/generate_version_board.py
	pre:scripts/versioning_pre.py
	post:scripts/versioning_post.py
	post:scripts/ota_package_post.py

[env:native]
platform = native
framework =
platform_packages =
extra_scripts =
test_build_src = true
build_src_filter =
	-<*>
	+<Physics.cpp>
	+<OscillationGuard.cpp>
	+<ShifterFunction.cpp>
	+<ShifterDetect.cpp>
build_flags =
	-std=gnu++17
	-iquote test/stubs
	-Itest/stubs
	-DUNIT_TEST
lib_deps =
	nanopb/Nanopb@^0.4.8
custom_nanopb_protos =
	+<../proto/diy_ffb_protocol.proto>
custom_nanopb_options =
	--error-on-unmatched
	-s packed_enum:true

[common]
lib_deps_external = 
	rfetick/Kalman @ ^1.1.0
	#lemmingdev/ESP32-BLE-Gamepad @ ^0.5.5
	#gin66/FastAccelStepper @ ^0.30.12
	gin66/FastAccelStepper @ ^0.31.0
	#https://github.com/ChrGri/FastNonAccelStepper.git
	dlloydev/QuickPID @ ^3.1.9
	tomstewart89/BasicLinearAlgebra @ ^3.2
	https://github.com/CK-AT/ADS1255-ADS1256.git
    nanopb/Nanopb@^0.4.8
	bakercp/PacketSerial @ ^1.4.0
	frankboesing/FastCRC@^1.41

[env:esp32s3usbotg]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
build_flags = 
	-Werror=return-type
	-DARDUINO_RUNNING_CORE=1
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DARDUINO_USB_DFU_ON_BOOT=0
	-DPCB_VERSION=6
	-DUSB_VID=0xF011
	-DUSB_PID=0xF011
	'-DUSB_PRODUCT="DiyFfbPedal"'
	'-DUSB_MANUFACTURER="OpenSource"'
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
lib_deps = 
	${common.lib_deps_external}
	schnoog/Joystick_ESP32S2 @ ^0.9.4
	adafruit/Adafruit MCP4725 @ ^2.0.2
	regenbogencode/ESPNowW@^1.0.2

[env:esp32]
